name: AUTOMULA CI

on:
  push:
    branches: [main, phase-1-foundation, phase-2-core-workflows, phase-3-product-polish, phase-4-workspace-reliability, phase-5-e2e-functionality, phase-6-production-hardening]
  pull_request:
    branches: [main, phase-4-workspace-reliability]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter @automula/web typecheck

      - name: Build web
        run: pnpm --filter @automula/web build

      - name: Typecheck extension
        run: pnpm --filter @automula/extension typecheck

      - name: Validate Chrome extension manifests
        run: pnpm --filter @automula/extension check:manifest

      - name: Build extension
        run: pnpm --filter @automula/extension build

      - name: Install Chromium for browser tests
        run: pnpm --filter @automula/web exec playwright install --with-deps chromium

      - name: Run browser and authenticated end-to-end tests
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_RUN_AI: ${{ vars.E2E_RUN_AI }}
          E2E_RUN_AUTH_RECOVERY: ${{ vars.E2E_RUN_AUTH_RECOVERY }}
          E2E_SECOND_EMAIL: ${{ secrets.E2E_SECOND_EMAIL }}
          E2E_SECOND_PASSWORD: ${{ secrets.E2E_SECOND_PASSWORD }}
        run: pnpm --filter @automula/web test:e2e
